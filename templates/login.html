<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión - SalónSistema</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            display: none;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            background: #fee2e2;
            color: #991b1b;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>SalónSistema</h1>

            <p class="subtitle">
                Iniciar sesión
            </p>

            <div id="mensajeError" class="error"></div>

            <form id="loginForm">

                <label for="username">
                    Usuario
                </label>

                <input
                    type="text"
                    id="username"
                    required
                    autocomplete="username"
                >

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    required
                    autocomplete="current-password"
                >

                <button type="submit">
                    Ingresar
                </button>

            </form>

        </div>

    </div>


    <script>

        const loginForm =
            document.getElementById("loginForm");

        const mensajeError =
            document.getElementById("mensajeError");


        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                mensajeError.style.display = "none";

                const username =
                    document.getElementById("username").value;

                const password =
                    document.getElementById("password").value;


                try {

                    const respuesta = await fetch(
                        "/auth/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                username: username,
                                password: password
                            })
                        }
                    );


                    const datos =
                        await respuesta.json();


                    if (!respuesta.ok) {

                        mensajeError.textContent =
                            datos.detail ||
                            "No se pudo iniciar sesión.";

                        mensajeError.style.display =
                            "block";

                        return;
                    }


                    window.location.href = "/";

                } catch (error) {

                    mensajeError.textContent =
                        "No se pudo conectar con el servidor.";

                    mensajeError.style.display =
                        "block";
                }
            }
        );

    </script>

</body>
</html>
